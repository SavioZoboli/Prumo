services:
  postgres:
    image: postgres:16-alpine
    container_name: prumo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - prumo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SMTP falso para desenvolvimento: captura todo e-mail enviado pela API.
  # Caixa de entrada em http://localhost:${MAILPIT_UI_PORT:-8025}
  mailpit:
    image: axllent/mailpit:latest
    container_name: prumo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  prumo_postgres_data: