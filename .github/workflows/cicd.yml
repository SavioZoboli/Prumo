name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ecs-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) BUILD: gera environment.ts do Angular, builda e envia imagens ao ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images (ECR)
    runs-on: ubuntu-latest
    env:
      API_DIR: src/api
      WEB_DIR: src/web
      ECR_API_REPO: ${{ secrets.ECR_API_REPOSITORY || 'prumo-app-api' }}
      ECR_WEB_REPO: ${{ secrets.ECR_WEB_REPOSITORY || 'prumo-app-web' }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Angular lê o environment em build-time: precisa existir ANTES do docker build
      - name: Gerar environment.ts do Angular
        env:
          ENV_HMI: ${{ secrets.ENV_HMI }}
        run: |
          set -euo pipefail
          API_URL=$(printf '%s\n' "$ENV_HMI" | tr -d '\r' | grep -E '^API_URL=' | head -1 | cut -d= -f2- | tr -d ' "')

          if [ -z "$API_URL" ]; then
            echo "API_URL não encontrada no secret ENV_HMI"
            exit 1
          fi

          TEMPLATE="$WEB_DIR/src/environments/environment.template.ts"
          sed -e "s|API_URL|$API_URL|g" "$TEMPLATE" > "$WEB_DIR/src/environments/environment.ts"
          sed -e "s|API_URL|$API_URL|g" "$TEMPLATE" > "$WEB_DIR/src/environments/environment.prod.ts"

      - name: Build e Push da Imagem da API NestJS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_API_REPO:latest $API_DIR
          docker push $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_API_REPO:latest

      - name: Build e Push da Imagem do Frontend Angular
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_WEB_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_WEB_REPO:latest $WEB_DIR
          docker push $ECR_REGISTRY/$ECR_WEB_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_WEB_REPO:latest

  # ---------------------------------------------------------------------------
  # 2) DEPLOY: nova task definition (imagem + .env) -> service
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ECS Fargate (Manual Approval)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production # exige aprovação manual
    env:
      CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME || 'prumo-app-cluster' }}
      SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME || 'prumo-app-service' }}
      API_CONTAINER: ${{ secrets.ECS_API_CONTAINER || 'api' }} # nome do container na task definition
      WEB_CONTAINER: ${{ secrets.ECS_WEB_CONTAINER || 'web' }} # nome do container na task definition
      ECR_API_REPO: ${{ secrets.ECR_API_REPOSITORY || 'prumo-app-api' }}
      ECR_WEB_REPO: ${{ secrets.ECR_WEB_REPOSITORY || 'prumo-app-web' }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Obter Registry do Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Registrar nova Task Definition (imagens + variáveis da API)
        id: taskdef
        env:
          ENV_API_DADOS: ${{ secrets.ENV_API_DADOS }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          API_IMAGE="$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG"
          WEB_IMAGE="$ECR_REGISTRY/$ECR_WEB_REPO:$IMAGE_TAG"

          CURRENT_TD=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" \
            --query 'services[0].taskDefinition' --output text)

          aws ecs describe-task-definition --task-definition "$CURRENT_TD" \
            --query taskDefinition > td-current.json

          CONTAINERS=$(jq -r '.containerDefinitions[].name' td-current.json | tr '\n' ' ')
          echo "Containers encontrados na Task Definition atual ($CURRENT_TD): $CONTAINERS"

          # Diagnóstico seguro do tipo de DB_HOST configurado em ENV_API_DADOS
          DB_HOST_VAL=$(printf '%s\n' "$ENV_API_DADOS" | tr -d '\r' | grep -E '^DB_HOST=' | head -1 | cut -d= -f2- | tr -d ' "' || true)
          if [ -z "$DB_HOST_VAL" ]; then
            echo "Aviso: DB_HOST não definido em ENV_API_DADOS (usará default localhost)"
          elif [[ "$DB_HOST_VAL" == *"rds.amazonaws.com"* ]]; then
            echo "DB_HOST aponta para AWS RDS (*.rds.amazonaws.com)"
          elif [ "$DB_HOST_VAL" = "localhost" ] || [ "$DB_HOST_VAL" = "127.0.0.1" ]; then
            echo "Aviso: DB_HOST está como '$DB_HOST_VAL' (conexão local na própria task)"
          else
            echo "DB_HOST configurado (host customizado)"
          fi

          for esperado in "$API_CONTAINER" "$WEB_CONTAINER"; do
            if ! jq -e --arg c "$esperado" '.containerDefinitions[] | select(.name == $c)' td-current.json > /dev/null; then
              echo "Erro: container '$esperado' não encontrado na Task Definition (disponíveis: $CONTAINERS)"
              exit 1
            fi
          done

          # .env (KEY=VALUE) -> [{name, value}], ignora comentários/linhas vazias e aspas externas
          printf '%s\n' "$ENV_API_DADOS" | tr -d '\r' | jq -R -s '
            split("\n")
            | map(select(test("^[A-Za-z_][A-Za-z0-9_]*=")))
            | map(capture("^(?<name>[A-Za-z_][A-Za-z0-9_]*)=(?<value>.*)$"))
            | map(.value |= sub("^\"(?<v>.*)\"$"; "\(.v)"))
          ' > env.json

          jq --arg api "$API_CONTAINER" --arg web "$WEB_CONTAINER" \
             --arg api_img "$API_IMAGE" --arg web_img "$WEB_IMAGE" \
             --slurpfile env env.json '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | .containerDefinitions |= (
                map(select(.name == $api or .name == $web))
                | map(
                    (if .dependsOn then
                      .dependsOn |= map(select(.containerName == $api or .containerName == $web))
                      | if (.dependsOn | length) == 0 then del(.dependsOn) else . end
                    else . end)
                    | if .name == $api then .image = $api_img | .environment = $env[0]
                      elif .name == $web then .image = $web_img
                      else . end
                  )
              )
          ' td-current.json > td-new.json

          NEW_TD=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "Nova task definition: $NEW_TD"
          echo "arn=$NEW_TD" >> "$GITHUB_OUTPUT"

      - name: Atualizar Service no ECS Fargate
        run: |
          set -euo pipefail
          TARGET_TD="${{ steps.taskdef.outputs.arn }}"

          aws ecs update-service \
            --cluster "$CLUSTER_NAME" --service "$SERVICE_NAME" \
            --task-definition "$TARGET_TD" \
            --force-new-deployment > /dev/null

          MAX_ATTEMPTS=12
          SLEEP_SECONDS=15
          STABLE=false

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "Verificando estabilidade do deploy (tentativa $i/$MAX_ATTEMPTS)..."

            # Se alguma task da nova Task Definition já caiu (STOPPED), falha na hora sem esperar o restante
            STOPPED_ARNS=$(aws ecs list-tasks \
              --cluster "$CLUSTER_NAME" --service-name "$SERVICE_NAME" \
              --desired-status STOPPED --query 'taskArns[0:5]' --output text | tr '\t' ' ' || true)

            if [ -n "$STOPPED_ARNS" ] && [ "$STOPPED_ARNS" != "None" ]; then
              FAILED_NEW=$(aws ecs describe-tasks \
                --cluster "$CLUSTER_NAME" --tasks $STOPPED_ARNS \
                --query "tasks[?taskDefinitionArn=='$TARGET_TD'].taskArn" --output text || true)

              if [ -n "$FAILED_NEW" ] && [ "$FAILED_NEW" != "None" ]; then
                echo "::error::Uma task da nova versão ($TARGET_TD) parou inesperadamente! Abortando espera."
                break
              fi
            fi

            # Verifica se o deployment novo já estabilizou (1 único deployment ativo e runningCount == desiredCount)
            IS_STABLE=$(aws ecs describe-services \
              --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" \
              --query "services[0].deployments | length(@) == \`1\` && @[0].taskDefinition == '$TARGET_TD' && @[0].runningCount == @[0].desiredCount" \
              --output text)

            if [ "$IS_STABLE" = "True" ]; then
              STABLE=true
              break
            fi

            sleep "$SLEEP_SECONDS"
          done

          if [ "$STABLE" != "true" ]; then
            echo "::error::Service não estabilizou. Últimos eventos e detalhes das tasks que pararam:"
            aws ecs describe-services \
              --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" \
              --query 'services[0].events[:5].[createdAt,message]' --output table || true

            STOPPED_TASKS=$(aws ecs list-tasks \
              --cluster "$CLUSTER_NAME" --service-name "$SERVICE_NAME" \
              --desired-status STOPPED --query 'taskArns[0:5]' --output text | tr '\t' ' ' || true)

            if [ -n "$STOPPED_TASKS" ] && [ "$STOPPED_TASKS" != "None" ]; then
              aws ecs describe-tasks \
                --cluster "$CLUSTER_NAME" --tasks $STOPPED_TASKS \
                --query 'tasks[].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
                --output json || true

              LOG_GROUP=$(jq -r --arg api "$API_CONTAINER" '.containerDefinitions[] | select(.name == $api) | .logConfiguration.options["awslogs-group"] // empty' td-new.json)
              LOG_PREFIX=$(jq -r --arg api "$API_CONTAINER" '.containerDefinitions[] | select(.name == $api) | .logConfiguration.options["awslogs-stream-prefix"] // empty' td-new.json)
              LOG_REGION=$(jq -r --arg api "$API_CONTAINER" '.containerDefinitions[] | select(.name == $api) | .logConfiguration.options["awslogs-region"] // empty' td-new.json)

              if [ -n "$LOG_GROUP" ] && [ -n "$LOG_PREFIX" ]; then
                for TASK_ARN in $STOPPED_TASKS; do
                  TASK_ID="${TASK_ARN##*/}"
                  STREAM_NAME="${LOG_PREFIX}/${API_CONTAINER}/${TASK_ID}"
                  echo "=== Logs do container '$API_CONTAINER' na task $TASK_ID (stream: $STREAM_NAME) ==="
                  aws logs get-log-events \
                    --region "${LOG_REGION:-${AWS_REGION:-us-east-1}}" \
                    --log-group-name "$LOG_GROUP" \
                    --log-stream-name "$STREAM_NAME" \
                    --limit 100 \
                    --query 'events[].message' \
                    --output text || echo "Não foi possível ler os logs do CloudWatch (verifique se a stream existe ou se a IAM role tem permissão logs:GetLogEvents)."
                done
              else
                echo "Container '$API_CONTAINER' não possui logConfiguration (awslogs) configurado na Task Definition."
              fi
            fi
            exit 1
          fi
          echo "Deploy concluído"
