server {
    listen 80;
    listen 443 ssl;
    server_name prumo-ind.duckdns.org localhost;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fallback da SPA (rotas do Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache (garante pegar a versão nova após deploy)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Assets com hash no nome: cache longo
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy reverso para chamadas /api/ direto para a API NestJS rodando em localhost:3000
    # (^~ evita que a regra de assets acima capture URLs de /api/ terminadas em .png, .svg etc.)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
