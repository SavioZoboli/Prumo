<mat-form-field
  appearance="outline"
  class="app-input"
  [class.app-input--error]="hasError"
>
  <mat-label *ngIf="label">
    {{ label }}<span *ngIf="required" class="app-input__required">&nbsp;*</span>
  </mat-label>

  <mat-icon matPrefix *ngIf="icon" class="app-input__icon">{{ matIconName }}</mat-icon>
@if(autocompletePanel){
<input
    matInput
    [type]="effectiveType"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    [attr.min]="min"
    [matAutocomplete]="autocompletePanel"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
}@else{
<input
    matInput
    [type]="effectiveType"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    [attr.min]="min"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
}

  <button *ngIf="type === 'password'" mat-icon-button matSuffix type="button"
    (click)="togglePasswordVisibility()" aria-label="Alternar visibilidade da senha">
    <mat-icon>{{ passwordVisible ? 'visibility_off' : 'visibility' }}</mat-icon>
  </button>

  <mat-hint *ngIf="hasError && errorMessage" class="app-input__error" role="alert">
    {{ errorMessage }}
  </mat-hint>
</mat-form-field>
