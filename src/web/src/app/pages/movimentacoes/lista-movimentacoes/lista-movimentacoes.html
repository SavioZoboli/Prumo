<div class="movimentacoes-page">

  <header class="movimentacoes-page__header with-actions">
    <div class="title-area">
      <span class="breadcrumb">Estoque</span>

      <h2>Movimentações</h2>

      <p>Registre entradas e saídas de materiais do estoque.</p>
    </div>

    <div class="action-area">
      <app-button
        label="+ NOVA MOVIMENTAÇÃO"
        [fullWidth]="false"
        (click)="abrirCadastro()"
      ></app-button>
    </div>
  </header>

  <section class="movimentacoes-page__table-container">

    <table
      mat-table
      [dataSource]="movimentacoes"
      class="movimentacoes-page__table"
    >

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
          Nº
        </th>

        <td mat-cell *matCellDef="let item">
          {{ item.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef>
          Data
        </th>

        <td mat-cell *matCellDef="let item">
          {{ item.data | date: 'dd/MM/yyyy HH:mm' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="operacao">
        <th mat-header-cell *matHeaderCellDef>
          Tipo
        </th>

        <td mat-cell *matCellDef="let item">

          <span
            class="movimentacoes-page__status"
            [class.success]="item.operacao === 'E'"
            [class.warning]="item.operacao === 'S'"
          >
            {{ formatarOperacao(item.operacao) }}
          </span>

        </td>
      </ng-container>

      <ng-container matColumnDef="itens">
        <th mat-header-cell *matHeaderCellDef>
          Itens
        </th>

        <td mat-cell *matCellDef="let item">
          {{ item.itens.length }}
        </td>
      </ng-container>

      <ng-container matColumnDef="motivo">
        <th mat-header-cell *matHeaderCellDef>
          Motivo
        </th>

        <td mat-cell *matCellDef="let item">
          {{ item.motivo || '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>
          Ações
        </th>

        <td mat-cell *matCellDef="let item">

          <button
            mat-icon-button
            type="button"
            aria-label="Editar movimentação"
            (click)="abrirEdicao(item)"
          >
            <mat-icon>edit</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="colunasExibidas"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: colunasExibidas"
        class="custom-row"
      ></tr>

    </table>

  </section>

  <app-cadastro-movimentacao
    [aberto]="painelAberto"
    [movimentacaoEmEdicao]="movimentacaoEmEdicao"
    [materiaisDisponiveis]="materiaisDisponiveis"
    [ordensCompraDisponiveis]="ordensCompraDisponiveis"
    (fechar)="fecharCadastro()"
    (salvar)="salvarMovimentacao($event)"
  ></app-cadastro-movimentacao>

</div>
