<div class="ordens-compra-page">

  <header class="ordens-compra-page__header with-actions">
    <div class="title-area">
      <span class="breadcrumb">Materiais</span>

      <h2>Ordens de Compra</h2>

      <p>Gerencie as ordens de compra de materiais.</p>
    </div>

    <div class="action-area">
      <app-button
        label="+ NOVA ORDEM"
        [fullWidth]="false"
        (click)="abrirCadastro()"
      ></app-button>
    </div>
  </header>

  <section class="ordens-compra-page__table-container">

    <table
      mat-table
      [dataSource]="ordens"
      class="ordens-compra-page__table"
    >

      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>
          Nº
        </th>

        <td mat-cell *matCellDef="let item">
          {{ item.numero }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fornecedor">
        <th mat-header-cell *matHeaderCellDef>
          Fornecedor
        </th>

        <td mat-cell *matCellDef="let item">
          {{ item.fornecedor.nome }}
        </td>
      </ng-container>

      <ng-container matColumnDef="dataEntrega">
        <th mat-header-cell *matHeaderCellDef>
          Data de entrega
        </th>

        <td mat-cell *matCellDef="let item">
          {{ item.dataEntrega | date: 'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="itens">
        <th mat-header-cell *matHeaderCellDef>
          Itens
        </th>

        <td mat-cell *matCellDef="let item">
          {{ item.itens.length }}
        </td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>
          Valor total
        </th>

        <td mat-cell *matCellDef="let item">
          {{ calcularTotal(item.itens) | currency: 'BRL' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>
          Ações
        </th>

        <td mat-cell *matCellDef="let item">

          <button
            mat-icon-button
            type="button"
            aria-label="Editar ordem de compra"
            (click)="abrirEdicao(item)"
          >
            <mat-icon>edit</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="colunasExibidas"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: colunasExibidas"
        class="custom-row"
      ></tr>

    </table>

  </section>

  <app-cadastro-ordem-compra
    [aberto]="painelAberto"
    [ordemEmEdicao]="ordemEmEdicao"
    [fornecedores]="fornecedores"
    [materiaisDisponiveis]="materiaisDisponiveis"
    (fechar)="fecharCadastro()"
    (salvar)="salvarOrdem($event)"
  ></app-cadastro-ordem-compra>

</div>
